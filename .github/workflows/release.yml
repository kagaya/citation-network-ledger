name: Release

on:
  push:
    branches:
      - main
    paths:
      - VERSION

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Run race detector
        working-directory: source
        run: go test -race -count=1 ./...

      - name: Verify and cross-build
        working-directory: source
        run: sh build_all.sh

      - name: Verify release metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          source_version=$(sed -n 's/.*appVersion[[:space:]]*=[[:space:]]*"\([^"]*\)".*/\1/p' source/model.go)
          citation_version=$(sed -n 's/^version: "\([^"]*\)"/\1/p' CITATION.cff)
          test "$version" = "$source_version"
          test "$version" = "$citation_version"
          case "$version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "VERSION must use MAJOR.MINOR.PATCH" >&2; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Verify checksums
        working-directory: source/dist
        run: sha256sum -c SHA256SUMS.txt

      - name: Publish tag and release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          gh release create "$tag" source/dist/* \
            --target "$GITHUB_SHA" \
            --title "Citation Network Ledger $tag" \
            --generate-notes
